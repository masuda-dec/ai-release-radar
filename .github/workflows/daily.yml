name: Daily AI Release Radar
on:
  schedule:
    # 07:00 Japan Standard Time (UTC+09:00).
    - cron: '0 22 * * *'
  push:
    branches: [main]
    paths-ignore:
      - 'data/releases.json'
      - 'data/releases.js'
      - 'data/page_hashes.json'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: 'pages'
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test release collector
        run: python -m unittest discover -s tests -v
      - name: Check browser script syntax
        run: node --check assets/app.js
      - name: Collect official releases and update site data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RADAR_MODEL: ${{ vars.RADAR_MODEL }}
          RADAR_AI_MAX_ITEMS: ${{ vars.RADAR_AI_MAX_ITEMS || '5' }}
          RADAR_COMMUNITY_MAX_ITEMS: ${{ vars.RADAR_COMMUNITY_MAX_ITEMS || '5' }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python scripts/update.py
      - name: Commit historical data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/releases.json data/releases.js data/page_hashes.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update daily AI release radar'
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Build static site payload
        run: |
          mkdir _site
          cp index.html _site/
          cp -R assets data _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
        # Enable GitHub Pages > Source: GitHub Actions in repository settings.
